name: Auto-merge
on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the pull requests that cleared the cooldown, merge nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One package at a time: a merge moves main, and the next pin is replayed
      # on top of it.
      max-parallel: 1
      matrix:
        package: [claude-desktop, chatgpt-desktop, coroslink, inputs]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Unlike the other workflows here, this job force-pushes the replayed
          # pin to the update branch, so it keeps the checkout credentials.
          fetch-depth: 0
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            accept-flake-config = false
      - name: Merge the pins that cleared the cooldown
        env:
          PACKAGE: ${{ matrix.package }}
          # Days a pull request must stay open before it is merged.
          COOLDOWN_DAYS: 7
          DRY_RUN: ${{ inputs.dry_run || false }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/automerge.sh "$PACKAGE"
